<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاکتورساز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Lalezar&family=Noto+Kufi+Arabic:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#e9eef2;color:#14232b;padding-bottom:96px}
.app{max-width:600px;margin:auto;padding:10px}
.stageW{overflow:hidden;border-radius:14px;box-shadow:0 6px 24px #0003;direction:ltr;margin-bottom:12px;background:#fff}
.stage{transform-origin:top left;width:540px}
.tabs{display:flex;gap:6px;background:#fff;border-radius:16px;padding:5px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;border-radius:12px;padding:10px 0;font:700 13px Vazirmatn;color:#5b6b75;cursor:pointer}
.tabs button.on{background:#0f3d4c;color:#fff}
.pn{display:none;background:#fff;border-radius:18px;padding:14px}
.pn.on{display:block}
h3{font-size:13px;font-weight:800;margin:2px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lay{flex:1 1 30%;min-width:96px;border:2px solid #e3e9ee;border-radius:14px;background:#f6f9fb;padding:8px;text-align:center;font:700 12px Vazirmatn;cursor:pointer}
.lay svg{display:block;width:100%;height:52px;margin-bottom:5px}
.lay.on{border-color:#0f3d4c;background:#fff}
.fnt{flex:1;border:2px solid #e3e9ee;border-radius:12px;background:#f6f9fb;padding:9px 4px;text-align:center;font-size:17px;cursor:pointer}
.fnt.on{border-color:#0f3d4c;background:#fff}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dbe3e8;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px #111}
.cc{display:flex;gap:10px;align-items:center;flex:1 1 45%;font-size:12.5px;font-weight:700}
.cc input{width:52px;height:40px;border:0;background:none;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
label{display:block;font-size:12px;font-weight:500;color:#5b6b75;margin-bottom:3px}
input[type=text],input:not([type]),input[inputmode]{width:100%;font:500 15px Vazirmatn;padding:10px 12px;border:1.5px solid #dde4e9;border-radius:12px;background:#fafcfd;outline:none;direction:rtl}
input:focus{border-color:#12909f}
.item{background:#f4f8fa;border-radius:14px;padding:10px;margin-bottom:8px;position:relative}
.del{position:absolute;left:8px;top:8px;border:0;background:#fde4e4;color:#c22;border-radius:8px;width:28px;height:28px;font-size:17px;cursor:pointer}
.btn{border:0;border-radius:14px;padding:12px 16px;font:700 14px Vazirmatn;cursor:pointer}
.add{background:#e4f3f5;color:#0d6f7c;width:100%}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffe;border-top:1px solid #dde4e9;z-index:5}
.bar .btn{display:block;width:100%;max-width:576px;margin:auto;background:#0f3d4c;color:#fff;font-size:16px;padding:15px}
#ov{position:fixed;inset:0;background:#0c0c0c;z-index:99;overflow:auto;display:none}
#ov img{display:block;width:100%;max-width:700px;margin:auto}
#ov .ctl{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
#ov .btn{background:#fff;color:#111;box-shadow:0 4px 18px #0006}

/* ===== INVOICE (540px) ===== */
.inv{width:540px;position:relative;overflow:hidden;direction:rtl;font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:0}
.inv *{letter-spacing:0}
.inv .in{position:relative;padding:0 28px 24px}
.inv .hd{position:relative;padding:26px 0 16px;text-align:right}
.inv .num{display:inline-block;background:var(--c1);color:#fff;font-weight:700;font-size:14px;padding:8px 20px;border-radius:30px}
.inv h1{font:400 44px/1.3 var(--tf);color:var(--h1);margin-top:6px}
.inv .date{font-weight:700;font-size:15.5px;margin-top:2px}
.inv .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
.inv .deco{position:absolute;left:-28px;top:0}
.inv .pr{display:flex;gap:10px;margin-bottom:12px}
.inv .party{flex:1;background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.inv .av{width:40px;height:40px;border-radius:50%;background:var(--c2);flex:none;display:flex;align-items:center;justify-content:center}
.inv .party small{display:block;color:var(--c2);font-weight:800;font-size:13px}
.inv .party b{font-size:16.5px;font-weight:800;line-height:1.4}
.inv .th,.inv .tr{display:grid;align-items:center;text-align:center;gap:4px;padding:0 12px}
.inv .th{background:var(--c1);color:#fff;border-radius:14px;height:42px;font-weight:700;font-size:13px}
.inv .tr{min-height:48px;font-size:14.5px;font-weight:500;padding-top:4px;padding-bottom:4px}
.inv .tr:nth-child(even){background:var(--zebra)}
.inv .tr .nm{text-align:right;font-weight:800;font-size:16px;line-height:1.4}
.inv .tr .fin{color:var(--c2);font-weight:800}
.inv .tot{margin-top:14px;border-radius:20px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:14px 20px}
.inv .tot div{display:flex;justify-content:space-between;font-size:15px;padding:5px 0}
.inv .tot .g{border-top:2px dashed #fff7;margin-top:6px;padding-top:12px;font-size:21px;font-weight:900}
.inv .wd{margin-top:10px;background:var(--soft);border-radius:16px;padding:12px 16px}
.inv .wd b{font-size:14px;margin-left:8px}
.inv .wd span{color:var(--mut);font-size:14px;line-height:1.9}
.inv .pay{margin-top:12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.inv .pay i{width:24px;height:24px;border-radius:50%;background:var(--c2);display:inline-block}
.inv .note{margin-top:6px;color:var(--mut);font-size:13px}
.inv .sg{display:flex;gap:24px;margin-top:16px}
.inv .sg div{flex:1;border-top:1.5px solid var(--line);text-align:center;padding-top:8px;font-weight:700;font-size:13.5px;height:78px;position:relative}
.inv .sg img{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;max-height:52px;max-width:80%}
.inv .ft{margin-top:8px;border-top:1.5px solid var(--line);padding-top:10px;text-align:center;color:var(--mut);font-size:12.5px}
/* layouts */
.L-band .hd{margin:0 -28px 14px;padding:26px 28px 22px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:0 0 32px 32px;color:#fff}
.L-band h1,.L-band .date{color:#fff}.L-band .sub{color:#ffffffd0}.L-band .num{background:#ffffff33}
.L-side{border-right:16px solid var(--c1)}
.L-side:after{content:"";position:absolute;right:-16px;bottom:0;width:16px;height:30%;background:var(--c2)}
.L-min .hd{border-bottom:2.5px solid var(--c1);margin-bottom:14px}
.L-min .num{background:none;color:var(--c1);border:2px solid var(--c1)}
.L-min .party{background:none;border:1.5px solid var(--line)}
.L-min .th{background:none;color:var(--c1);border-bottom:2.5px solid var(--c1);border-radius:0}
.L-min .tr{background:none!important;border-bottom:1px solid var(--line)}
.L-min .tot{background:var(--c1)}
.L-dark:before{content:"";position:absolute;left:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--c2) 0,#0000 68%);opacity:.45}
.L-dark .num{background:linear-gradient(90deg,var(--c1),var(--c2))}
.L-dark .tot,.L-dark .th{background:linear-gradient(135deg,var(--c1),var(--c2))}
.L-card{padding:14px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.L-card .in{background:#fff;border-radius:26px;color:#14232b}
.L-card{--ink:#14232b}
</style>
</head>
<body>
<div class="app">
  <div class="stageW" id="sw"><div class="stage" id="stage"></div></div>

  <div class="tabs" id="tabs">
    <button class="on" data-p="p1">طرح</button><button data-p="p2">رنگ</button><button data-p="p3">اطلاعات</button><button data-p="p4">اقلام</button>
  </div>

  <div class="pn on" id="p1">
    <h3>طرح قالب</h3><div class="row" id="lays"></div>
    <h3>فونت عنوان</h3><div class="row" id="fnts"></div>
  </div>
  <div class="pn" id="p2">
    <h3>رنگ آماده</h3><div class="row" id="sws"></div>
    <h3>رنگ دلخواه</h3>
    <div class="row"><label class="cc"><input type="color" id="c1" value="#0f3d4c">رنگ اصلی (تیره)</label><label class="cc"><input type="color" id="c2" value="#12909f">رنگ فرعی (روشن)</label></div>
  </div>
  <div class="pn" id="p3">
    <div class="g2"><div><label>شماره فاکتور</label><input id="num" value="۱"></div><div><label>تاریخ</label><input id="date"></div></div>
    <div class="g2"><div><label>فروشنده</label><input id="seller" value="کسب‌وکار من"></div><div><label>خریدار</label><input id="buyer" value="مشتری"></div></div>
    <div class="g2"><div><label>مالیات (٪)</label><input id="tax" inputmode="decimal" value="9"></div><div><label>روش پرداخت</label><input id="pay" value="نقدی"></div></div>
    <div style="margin-bottom:8px"><label>یادداشت (اختیاری)</label><input id="note"></div>
    <div><label>تصویر امضا/مهر فروشنده (اختیاری)</label><input type="file" id="sig" accept="image/*"></div>
  </div>
  <div class="pn" id="p4"><div id="items"></div><button class="btn add" onclick="addItem()">+ افزودن ردیف</button></div>
</div>
<div class="bar"><button class="btn" onclick="make()" id="mk">ساخت عکس فاکتور</button></div>
<div id="ov"><img id="oi" alt="فاکتور"><div class="ctl"><button class="btn" onclick="dl()">دانلود</button><button class="btn" onclick="ov.style.display='none'">بستن</button></div></div>

<script>
const $=id=>document.getElementById(id);
const LAY=[['diag','مورب'],['band','نوار رنگی'],['side','ستون کناری'],['min','مینیمال'],['dark','تیره'],['card','کارت']];
const FONTS=[['Lalezar','لالەزار'],['Noto Kufi Arabic','کوفی'],['Vazirmatn','وزیر']];
const PAL=[['#0f3d4c','#12909f'],['#12326b','#2f7cf6'],['#0b5d3b','#22b573'],['#3b1a7a','#8b5cf6'],['#7a1235','#e0426b'],['#b33a00','#ff8a1f'],['#1c1c22','#6b7280'],['#1f2a5a','#ff5c8a'],['#7a5a00','#f2b705'],['#00695c','#26c6da'],['#5b1e1e','#ef4444'],['#0a2540','#00d4aa']];
let L='diag',F='Lalezar',C=PAL[0].slice(),sig='',items=[{n:'محصول نمونه ۱',q:'1',p:'658',d:''},{n:'محصول نمونه ۲',q:'2',p:'558',d:''}];

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('')};
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[^\d.]/g,'');
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('date').value=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'long',year:'numeric'}).format(new Date());

const O=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'],
Tn=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'],
H=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'],
SC=['','هزار','میلیون','میلیارد','تریلیون'];
function three(n){const p=[],h=Math.floor(n/100),r=n%100;if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else{p.push(Tn[Math.floor(r/10)]);if(r%10)p.push(O[r%10])}}return p.join(' و ')}
function words(n){n=Math.round(n);if(!n)return 'صفر';const g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
const p=[];for(let i=g.length-1;i>=0;i--)if(g[i])p.push(three(g[i])+(SC[i]?' '+SC[i]:''));return p.join(' و ')}

/* mini layout icons */
function icon(k){const a=C[0],b=C[1],w='#fff',g='#dfe6ea';
const base=`<rect x="1" y="1" width="98" height="50" rx="6" fill="${k=='dark'?'#111827':k=='card'?a:w}" stroke="${g}"/>`;
const lines=`<rect x="14" y="34" width="72" height="4" rx="2" fill="${k=='dark'?'#334155':g}"/><rect x="14" y="42" width="52" height="4" rx="2" fill="${k=='dark'?'#334155':g}"/>`;
const m={diag:`<polygon points="1,1 46,1 30,28 1,28" fill="${a}"/><rect x="60" y="8" width="26" height="6" rx="3" fill="${b}"/>`,
band:`<path d="M1 7a6 6 0 0 1 6-6h86a6 6 0 0 1 6 6v14q0 8-10 8H11Q1 29 1 21z" fill="${a}"/>`,
side:`<rect x="88" y="1" width="11" height="50" fill="${a}"/><rect x="88" y="30" width="11" height="21" fill="${b}"/><rect x="50" y="8" width="30" height="7" rx="3" fill="${a}"/>`,
min:`<rect x="14" y="8" width="30" height="7" rx="3" fill="${a}"/><rect x="14" y="20" width="72" height="2" fill="${a}"/>`,
dark:`<circle cx="12" cy="8" r="20" fill="${b}" opacity=".5"/><rect x="50" y="8" width="30" height="7" rx="3" fill="${b}"/>`,
card:`<rect x="7" y="6" width="86" height="40" rx="7" fill="${w}"/><rect x="50" y="12" width="30" height="7" rx="3" fill="${b}"/>`};
return `<svg viewBox="0 0 100 52">${base}${m[k]}${k=='card'?'':lines}</svg>`}

function panels(){
 $('lays').innerHTML=LAY.map(([k,n])=>`<div class="lay ${k==L?'on':''}" onclick="L='${k}';panels();draw()">${icon(k)}${n}</div>`).join('');
 $('fnts').innerHTML=FONTS.map(([k,n])=>`<div class="fnt ${k==F?'on':''}" style="font-family:'${k}'" onclick="F='${k}';panels();draw()">${n}</div>`).join('');
 $('sws').innerHTML=PAL.map((p,i)=>`<div class="sw ${p[0]==C[0]&&p[1]==C[1]?'on':''}" style="background:linear-gradient(135deg,${p[0]},${p[1]})" onclick="C=PAL[${i}].slice();$('c1').value=C[0];$('c2').value=C[1];panels();draw()"></div>`).join('')}
$('c1').oninput=e=>{C[0]=e.target.value;panels();draw()};$('c2').oninput=e=>{C[1]=e.target.value;panels();draw()};
function itemList(){$('items').innerHTML=items.map((it,i)=>`<div class="item"><button class="del" onclick="items.splice(${i},1);itemList();draw()">×</button>
<label>شرح کالا/خدمت</label><input value="${esc(it.n)}" oninput="items[${i}].n=this.value;draw()" style="margin-bottom:6px">
<div class="g2" style="margin:0"><div><label>تعداد</label><input inputmode="decimal" value="${it.q}" oninput="items[${i}].q=this.value;draw()"></div><div><label>قیمت واحد (تومان)</label><input inputmode="decimal" value="${it.p}" oninput="items[${i}].p=this.value;draw()"></div></div>
<div style="margin-top:6px"><label>تخفیف (تومان)</label><input inputmode="decimal" value="${it.d}" oninput="items[${i}].d=this.value;draw()"></div></div>`).join('')}
function addItem(){items.push({n:'',q:'1',p:'',d:''});itemList();draw()}
$('sig').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{sig=r.result;draw()};r.readAsDataURL(f)};
['num','date','seller','buyer','tax','pay','note'].forEach(k=>$(k).oninput=draw);
$('tabs').onclick=e=>{const p=e.target.dataset.p;if(!p)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b==e.target));document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('on',x.id==p))};

function deco(){const doc=`<g transform="rotate(-8 90 130)"><rect x="40" y="52" width="110" height="140" rx="14" fill="#fff"/><g stroke="${C[1]}" stroke-width="7" stroke-linecap="round"><path d="M62 90h66M62 116h66M62 142h44"/></g></g><circle cx="150" cy="200" r="30" fill="#2fbf1d"/><path d="M135 200l11 11 20-22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
 return `<svg class="deco" width="250" height="170" viewBox="0 0 500 340"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="${C[0]}"/><stop offset="1" stop-color="${C[1]}"/></linearGradient></defs><polygon points="0,0 380,0 240,340 0,340" fill="url(#g1)"/><polygon points="0,0 250,0 120,250 0,250" fill="#fff" opacity=".13"/>${doc}</svg>`}
const person='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-5 4-7 8.500-7s8.500 2 8.500 7z"/></svg>';

function invHTML(){
 const tax=parseFloat(en($('tax').value))||0,dark=L==='dark';
 const list=items.filter(it=>it.n.trim()||parseFloat(en(it.p))>0);
 let sub=0,dis=0;
 const calc=list.map(it=>{const q=parseFloat(en(it.q))||0,p=parseFloat(en(it.p))||0,d=parseFloat(en(it.d))||0;sub+=q*p;dis+=d;return{n:it.n,q,p,d}});
 const hasD=dis>0,cols=hasD?'26px 1fr 34px 72px 58px 88px':'26px 1fr 38px 86px 100px';
 const rows=calc.map((r,i)=>`<div class="tr" style="grid-template-columns:${cols}"><span>${fa(i+1)}</span><div class="nm">${esc(r.n)||'—'}</div><span>${fa(r.q)}</span><span>${fa(r.p)}</span>${hasD?`<span>${r.d?fa(r.d):'—'}</span>`:''}<span class="fin">${fa(r.q*r.p-r.d)}</span></div>`).join('');
 const base=sub-dis,tx=base*tax/100,total=base+tx;
 const soft=dark?'#ffffff12':mix(C[1],'#ffffff',.9);
 const vars=`--c1:${dark?mix(C[0],C[1],.35):C[0]};--c2:${C[1]};--soft:${soft};--bg:${dark?'#0c111b':'#fff'};--ink:${dark?'#eef3f8':'#14232b'};--mut:${dark?'#93a3b5':'#66757f'};--line:${dark?'#ffffff26':'#dfe7eb'};--zebra:${dark?'#ffffff0a':mix(C[1],'#ffffff',.95)};--h1:${dark?mix(C[1],'#ffffff',.3):C[0]};--tf:'${F}',Vazirmatn`;
 return `<div class="inv L-${L}" style="${vars}"><div class="in"><div class="hd">${L==='diag'?deco():''}<div class="num">شماره فاکتور: ${esc($('num').value)}</div><h1>فاکتور فروش</h1><div class="date">تاریخ: ${esc($('date').value)}</div><div class="sub">این فاکتور به‌صورت الکترونیکی صادر شده است.</div></div>
<div class="pr"><div class="party"><div class="av">${person}</div><div><small>فروشنده</small><b>${esc($('seller').value)}</b></div></div><div class="party"><div class="av">${person}</div><div><small>خریدار</small><b>${esc($('buyer').value)}</b></div></div></div>
<div class="th" style="grid-template-columns:${cols}"><span>ردیف</span><span style="text-align:right">شرح کالا/خدمت</span><span>تعداد</span><span>قیمت</span>${hasD?'<span>تخفیف</span>':''}<span>مبلغ نهایی</span></div>${rows}
<div class="tot"><div><span>جمع جزء</span><span>${fa(sub)} تومان</span></div>${hasD?`<div><span>تخفیف</span><span>${fa(dis)} تومان</span></div>`:''}<div><span>مالیات (${fa(tax)}٪)</span><span>${fa(tx)} تومان</span></div><div class="g"><span>مبلغ قابل پرداخت</span><span>${fa(total)} تومان</span></div></div>
<div class="wd"><b>به حروف:</b><span>${words(total)} تومان</span></div>
<div class="pay"><i></i>روش پرداخت: ${esc($('pay').value)}</div>${$('note').value?`<div class="note">${esc($('note').value)}</div>`:''}
<div class="sg"><div>امضای خریدار</div><div>امضا و مهر فروشنده${sig?`<img src="${sig}">`:''}</div></div>
<div class="ft">— ${esc($('seller').value)} —</div></div></div>`}
